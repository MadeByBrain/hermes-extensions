name: writing-guard
version: 1.0.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.2"
description: "Style check for every Hermes answer in German and English: finds em and en dashes (optionally replaces them by rule), reports stock AI phrases and mixed or switched forms of address (du/Sie). Reports by default with one line under the answer; rule based, no model calls, no network."
author: MadeByBrain
license: MIT
homepage: https://github.com/MadeByBrain/hermes-extensions/tree/main/plugins/writing-guard
tags: [writing, style, german, dashes, du-sie, ai-phrases, transform_llm_output]
provides_hooks:
  - transform_llm_output
provides_tools:
  - writing_guard_check
config_schema:
  mode:
    type: str
    choices: [report, fix, off]
    default: report
    label: "Mode"
    description: "report = append one line with the findings, text unchanged. fix = replace dashes by rule, report the rest. off = do nothing."
  footer:
    type: bool
    default: true
    label: "Show report under the answer"
    description: "Off = never change the answer; the last report is only shown by /writing-guard."
  language:
    type: str
    choices: [auto, en, de]
    default: auto
    label: "Report language"
    description: "auto = the language of the answer."
  dash_style:
    type: str
    choices: [comma, hyphen]
    default: comma
    label: "Dash between words becomes"
    description: "comma = ', ' (default). hyphen = ' - '. Ranges (10-20) and list bullets always become a hyphen."
  address:
    type: str
    choices: [auto, du, sie]
    default: auto
    label: "German form of address"
    description: "auto = report du and Sie in the same paragraph and switches between answers. du or sie = also report every use of the other form."
  check_dashes:
    type: bool
    default: true
    label: "Check dashes"
  check_phrases:
    type: bool
    default: true
    label: "Check AI phrases"
  check_address:
    type: bool
    default: true
    label: "Check du/Sie (German only)"
  track_switches:
    type: bool
    default: true
    label: "Report du/Sie switches between answers"
    description: "Stores the form of address used last in each chat (only du or sie, nothing else)."
  skip_quotes:
    type: bool
    default: true
    label: "Skip quoted lines (> ...)"
  extra_phrases:
    type: list
    default: []
    label: "Extra phrases to report"
    description: "Your own phrases, plain text, case insensitive."
  ignore_phrases:
    type: list
    default: []
    label: "Phrases to ignore"
    description: "Rule ids (for example en.seamless) or the exact phrase."
  disabled_platforms:
    type: list
    default: [cron, subagent, kanban, batch, webhook]
    label: "Off on"
    description: "Platforms where answers are never checked (background jobs)."
